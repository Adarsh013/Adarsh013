name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Adarsh013
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%232d3343,%237C3AED,%238B5CF6,%23A78BFA,%23C4B5FD
            dist/github-contribution-grid-snake.svg?color_snake=%237C3AED&color_dots=%23EDE9FE,%23C4B5FD,%23A78BFA,%238B5CF6,%237C3AED

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
